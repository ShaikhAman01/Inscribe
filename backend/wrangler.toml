name = "backend"
main = "src/index.ts"
compatibility_date = "2024-10-02"
compatibility_flags = [ "nodejs_compat" ]

# DATABASE_URL and JWT_SECRET are set as encrypted secrets (wrangler secret put),
# not plaintext vars. Locally they come from .dev.vars (gitignored).

[observability]
enabled = true

[vars]
ALLOWED_ORIGINS = "https://inscribe.shaikhaman.in,http://localhost:5173"
# Vercel preview deployments of this project only: inscribe-<9-char id>-<team>.vercel.app
PREVIEW_ORIGIN_PATTERN = "^https://inscribe-[a-z0-9]{9}-shaikhaman01s-projects\\.vercel\\.app$"


# [[kv_namespaces]]
# binding = "MY_KV_NAMESPACE"
# id = "xxxxxxxxxxxxxxxxxxxxxxxxxxxxxxxx"

# [[r2_buckets]]
# binding = "MY_BUCKET"
# bucket_name = "my-bucket"

# [[d1_databases]]
# binding = "DB"
# database_name = "my-database"
# database_id = ""

[ai]
binding = "AI"